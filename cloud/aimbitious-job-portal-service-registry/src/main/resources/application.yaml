server:
  port: ${PORT:8761}

spring:
  application:
    name: aimbitious-job-portal-service-registry
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
server:
  port: 8888

spring:
  application:
    name: aimbitious-job-portal-config-server

  cloud:
    config:
      server:
        git:
#          github repo url below
          uri: "https://github.com/abul-hasan-farrukh/job-portal-config"
          clone-on-start: true
          default-label: master

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
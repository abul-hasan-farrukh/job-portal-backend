spring:
  application:
    name: aimbitious-job-portal-notification-service


  config:
    import: "optional:configserver:https://aimbitious-config-server.onrender.com"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

#    add AiVen Kafka authentication mechanism
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: SCRAM-SHA-256
      sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";'

    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.aimbitious.job.event"

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always
      show-components: always

emailjs:
  service-id: ${EMAILJS_SERVICE_ID}
  template-id: ${EMAILJS_TEMPLATE_ID}
  public-key: ${EMAILJS_PUBLIC_KEY}
  private-key: ${EMAILJS_PRIVATE_KEY}